</style><main><h1>Codex 聊天用量状态条</h1><p class="hint">独立布局预览，使用模拟数据。</p><div class="tools"><button onclick="document.body.classList.toggle('dark')">切换深浅色</button><button onclick="setPreviewMode('codex')">Codex</button><button onclick="setPreviewMode('work')">Work</button><button onclick="setPreviewMode('chat')">普通聊天</button><button onclick="document.querySelector('.composer [data-above-composer-conversation-id]').setAttribute('data-above-composer-conversation-id','00000000-0000-0000-0000-000000000002')">模拟切换聊天</button></div><article>状态条位于输入框底部两侧原生按钮之间。<br>点击“数值 tok”或“上下文”展开明细；点击外部或按 Esc 收起。<br>普通聊天隐藏；Codex 与 Work 显示。</article></main>
